<!DOCTYPE html>
<html>
<head>
    <title>USGS River Discharge Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 10px; 
            margin: 0;
        }
        
        /* The CSS Grid magic happens here */
        #charts-wrapper {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Two equal columns */
            gap: 20px; /* 30px space between the graphs */
        }

        .chart-container { 
            position: relative; 
            height: 300px; 
            width: 100%; 
        }

        /* Responsive rule: On small screens (like phones), drop back to 1 column */
        @media (max-width: 800px) {
            #charts-wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div id="charts-wrapper"></div>

    <script>
       // 1. DYNAMICALLY LOAD SITES FROM THE URL
        const urlParams = new URLSearchParams(window.location.search);
        const sitesParam = urlParams.get('sites');
        
        let siteNumbers = [];
        
        if (sitesParam) {
            // If the URL contains "?sites=...", split the numbers by comma
            siteNumbers = sitesParam.split(',');
        } 

        async function fetchAllSites() {
            const wrapper = document.getElementById('charts-wrapper');

            for (const siteNo of siteNumbers) {
                try {
                    const ivUrl = 'https://' + 'waterservices.usgs.gov' + '/nwis/iv/?format=json&sites=' + siteNo + '&period=P7D&parameterCd=00060&siteStatus=all';
                    
                    const response = await fetch(ivUrl);
                    const data = await response.json();

                    const dynamicSiteName = data.value.timeSeries[0].sourceInfo.siteName;
                    const timeSeries = data.value.timeSeries[0].values[0].value;
                 const continuousData = [];
                    for (let i = 0; i < timeSeries.length; i++) {
                        const currentItem = timeSeries[i];
                        const currentTime = new Date(currentItem.dateTime);
                        const currentValue = parseFloat(currentItem.value);

                        if (i > 0) {
                            const previousTime = new Date(timeSeries[i - 1].dateTime);
                            // Calculate difference in minutes
                            const timeDiffMinutes = (currentTime - previousTime) / (1000 * 60);
                            
                            // If the gap is greater than 60 minutes, data is missing
                            if (timeDiffMinutes > 60) {
                                // Insert a null point right after the last good reading to break the line
                                continuousData.push({
                                    x: new Date(previousTime.getTime() + (1000 * 60)), 
                                    y: null
                                });
                            }
                        }
                        
                        continuousData.push({
                            x: currentTime,
                            y: currentValue
                        });
                    }

                    const chartDiv = document.createElement('div');
                    chartDiv.className = 'chart-container';
                    const canvas = document.createElement('canvas');
                    chartDiv.appendChild(canvas);
                    wrapper.appendChild(chartDiv);

                    renderChart(canvas, continuousData, dynamicSiteName, siteNo);

                } catch (error) {
                    console.error("Error fetching USGS data for site " + siteNo + ":", error);
                    const errorMsg = document.createElement('p');
                    errorMsg.style.color = 'red';
                    errorMsg.textContent = "Error loading river data for site " + siteNo;
                    wrapper.appendChild(errorMsg);
                }
            }
        }

        function renderChart(canvasElement, continuousData, dynamicSiteName, siteNo) {
            const ctx = canvasElement.getContext('2d');
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: 'Discharge',
                        data: continuousData,
                        borderColor: 'rgba(0, 51, 153, 1)', 
                        borderWidth: 2,
                        pointRadius: 0, 
                        tension: 0.1,
                        fill: false,
                        spanGaps: false

                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    // Makes the tooltip appear when hovering anywhere in the vertical column, not just exactly on the line
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                displayFormats: { day: 'MMM d' },
                                tooltipFormat: 'MMM d, yyyy h:mm a' // This handles the Time format in the tooltip title
                            },
                            title: { display: true, text: 'Date' }
                        },
                        y: {
                            type: 'logarithmic',
                            title: { display: true, text: 'Discharge (ft³/s) [Log Scale]' }
                        }
                    },
                    plugins: {
                        legend: { display: false, position: 'top' },
                        title: { 
                            display: true, 
                            text: [
                                dynamicSiteName,
                                'USGS No: ' + siteNo
                            ]
                        },
                        // Custom Tooltip Configuration
                        tooltip: {
                            displayColors: false, // Hides the little color box in the tooltip
                            callbacks: {
                                label: function(context) {
                                    // Formats the hover text to show "X cfs"
                                    return `Discharge: ${context.parsed.y} cfs`;
                                }
                            }
                        }
                    }
                }
            });
        }
        fetchAllSites();
    </script>
</body>
</html>
